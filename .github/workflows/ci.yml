name: CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

jobs:
  verify-node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      # Keep title validation in the required verify check. Read event data rather
      # than interpolating untrusted PR text into shell commands.
      - name: Validate Conventional Commit PR title
        if: github.event_name == 'pull_request'
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { pull_request: { title } } = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const conventionalTitle = /^(feat|fix|perf|docs|refactor|test|build|ci|chore|revert|style)(\([^()\r\n]+\))?!?: \S[^\r\n]*$/u;
          if (/[\r\n]/u.test(title) || !conventionalTitle.test(title)) {
            console.error('PR title must use Conventional Commits, e.g. feat: add capability filters or fix(core)!: change the contract.');
            process.exit(1);
          }
          console.log('PR title follows Conventional Commits.');
          NODE

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.0.0 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify (lint + typecheck + tests + build)
        run: pnpm run verify

      - name: Offline release checks
        if: matrix.node == 24
        run: pnpm run check:release

  opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        opencode: [2.0.16, 2.0.24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.0.0 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install pinned OpenCode host
        env:
          OPENCODE_VERSION: ${{ matrix.opencode }}
        run: npm install --global "@opencode/cli@$OPENCODE_VERSION"
      - name: Packed artifact and concrete wire model
        run: pnpm run smoke:opencode
      - name: Inspection RPC without model calls
        run: pnpm run smoke:inspect

  # Preserve the required check name used by the branch rulesets.
  verify:
    runs-on: ubuntu-latest
    needs: [verify-node, opencode]
    if: always()
    steps:
      - name: Require all compatibility checks
        env:
          NODE_RESULT: ${{ needs.verify-node.result }}
          HOST_RESULT: ${{ needs.opencode.result }}
        run: test "$NODE_RESULT" = success && test "$HOST_RESULT" = success
