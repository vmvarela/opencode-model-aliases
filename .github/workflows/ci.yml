name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.0.0 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify (lint + typecheck + tests + build)
        run: pnpm run verify
