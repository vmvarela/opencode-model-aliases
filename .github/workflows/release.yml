name: Release

# Publish only when explicitly dispatched from master.
on:
  workflow_dispatch:

permissions:
  contents: read

# Only one release at a time on the same branch; it is never canceled midway.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'vmvarela/opencode-model-aliases' &&
      github.ref == 'refs/heads/master'
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Configure git identity for the release tag
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.0.0 --activate

      - name: Pin npm on the runner
        run: npm install --global npm@11.6.2

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Verify (lint + typecheck + tests + build)
        run: pnpm run verify

      - name: Offline release checks
        run: pnpm run check:release

      # Note: the npm plugin uses OIDC (trusted publishing); no token is
      # needed for npm.
      - name: Release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
