name: Feature request
description: Suggest an improvement to opencode-model-aliases
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what's missing?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work? Configuration examples welcome.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This is not one of the explicitly out-of-scope items mentioned in the README (prompt classification, smart routing, proxying, credential management, retries/failover, billing, session orchestration).
